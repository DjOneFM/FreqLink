# ============================================================
# FreqMode Color Theme for FreqLink
# Deep dark background with Pioneer-orange accents
# ============================================================

# --- Base colors ---
@background       = #121212
@foreground       = #F0F0F0
@accent           = #FF6600
@accentHover      = #FF8800
@border           = #2A2A2A
@panelBackground  = #1E1E1E
@inputBackground  = #242424
@mutedText        = #888888

# --- General UI ---
background                          = @background
foreground                          = @foreground
disabledForeground                  = @mutedText

# --- Panels and components ---
Panel.background                    = @panelBackground
RootPane.background                 = @background
ScrollPane.background               = @panelBackground
SplitPane.background                = @panelBackground
TabbedPane.background               = @panelBackground

# --- Buttons ---
Button.background                   = #2A2A2A
Button.foreground                   = @foreground
Button.hoverBackground              = #FF6600
Button.hoverForeground              = #FFFFFF
Button.pressedBackground            = #CC4400
Button.pressedForeground            = #FFFFFF
Button.focusedBorderColor           = @accent
Button.selectedBackground           = @accent
Button.selectedForeground           = #FFFFFF

# --- Toggle buttons ---
ToggleButton.background             = #2A2A2A
ToggleButton.foreground             = @foreground
ToggleButton.selectedBackground     = @accent
ToggleButton.selectedForeground     = #FFFFFF
ToggleButton.hoverBackground        = #FF8800

# --- Text fields and inputs ---
TextField.background                = @inputBackground
TextField.foreground                = @foreground
TextField.caretForeground           = @accent
TextField.selectionBackground       = @accent
TextField.selectionForeground       = #FFFFFF
TextArea.background                 = @inputBackground
TextArea.foreground                 = @foreground
TextArea.selectionBackground        = @accent
TextArea.selectionForeground        = #FFFFFF
ComboBox.background                 = @inputBackground
ComboBox.foreground                 = @foreground
ComboBox.selectionBackground        = @accent
ComboBox.selectionForeground        = #FFFFFF

# --- Lists and tables ---
List.background                     = @panelBackground
List.foreground                     = @foreground
List.selectionBackground            = @accent
List.selectionForeground            = #FFFFFF
Table.background                    = @panelBackground
Table.foreground                    = @foreground
Table.selectionBackground           = @accent
Table.selectionForeground           = #FFFFFF
Table.gridColor                     = @border
TableHeader.background              = #1A1A1A
TableHeader.foreground              = @foreground

# --- Menu ---
MenuBar.background                  = #0A0A0A
MenuBar.foreground                  = @foreground
Menu.background                     = #1A1A1A
Menu.foreground                     = @foreground
Menu.selectionBackground            = @accent
Menu.selectionForeground            = #FFFFFF
MenuItem.background                 = #1A1A1A
MenuItem.foreground                 = @foreground
MenuItem.selectionBackground        = @accent
MenuItem.selectionForeground        = #FFFFFF
PopupMenu.background                = #1A1A1A
PopupMenu.foreground                = @foreground
Separator.foreground                = @border

# --- Scroll bars ---
ScrollBar.background                = @panelBackground
ScrollBar.thumb                     = #3A3A3A
ScrollBar.thumbHover                = @accent
ScrollBar.thumbPressed              = #CC4400
ScrollBar.track                     = @panelBackground

# --- Title bar / window decorations ---
TitlePane.background                = #0A0A0A
TitlePane.foreground                = @foreground
TitlePane.inactiveBackground        = #121212
TitlePane.inactiveForeground        = @mutedText
TitlePane.buttonHoverBackground     = @accent

# --- Tabs ---
TabbedPane.foreground               = @foreground
TabbedPane.selectedForeground       = #FFFFFF
TabbedPane.underlineColor           = @accent
TabbedPane.hoverColor               = #2A2A2A
TabbedPane.focusColor               = #FF880033

# --- Progress bar ---
ProgressBar.background              = @border
ProgressBar.foreground              = @accent

# --- Slider ---
Slider.thumbColor                   = @accent
Slider.trackValueColor              = @accent
Slider.trackColor                   = @border

# --- Check boxes and radio buttons ---
CheckBox.icon.selectedBackground    = @accent
CheckBox.icon.selectedBorderColor   = @accent
CheckBox.icon.hoverBorderColor      = @accentHover
RadioButton.icon.selectedColor      = @accent
RadioButton.icon.hoverBorderColor   = @accentHover

# --- Focus ---
Component.focusColor                = @accent
Component.focusedBorderColor        = @accent

# --- Borders ---
Component.borderColor               = @border
Component.disabledBorderColor       = #222222
